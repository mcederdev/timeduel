<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../images/icon.png">
<title>Time Duel Challenge</title>
<meta name="description" content="You've been challenged in Time Duel: Which Came First.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* One centred card, Neon Arcade style. Single dark theme by choice. */
  :root {
    --bg: #0b0620; --panel: #1a1142; --ink: #f3eeff; --muted: #b8acdf; --rule: #3a2e70;
    --cyan: #22f2ff; --magenta: #ff3df2; --yellow: #ffe14d; --green: #2bea8e;
    --font-display: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background:
      radial-gradient(600px 420px at 10% -10%, rgba(82,34,184,.6), transparent 70%),
      radial-gradient(600px 420px at 110% 105%, rgba(163,18,122,.5), transparent 70%), var(--bg);
    color: var(--ink); font: 400 17px/1.55 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px;
  }
  .card { width: 100%; max-width: 26rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 24px;
          padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center;
          box-shadow: 0 0 40px rgba(255,61,242,.15); }
  .card img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 0 18px rgba(34,242,255,.35); }
  h1 { margin: 0; font: 400 clamp(22px, 6.5vw, 30px)/1.15 var(--font-display); text-wrap: balance; }
  h1 span { color: var(--magenta); text-shadow: 0 0 16px rgba(255,61,242,.55); }
  .label { font: 500 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .points { font: 400 clamp(44px, 14vw, 60px)/1 var(--font-display); color: var(--yellow); text-shadow: 0 0 18px rgba(255,225,77,.5); }
  .muted { color: var(--muted); margin: 0; }
  p { margin: 0; }
  .btn { display: block; width: 100%; padding: 16px 18px; border-radius: 16px; text-decoration: none;
         font: 400 17px/1 var(--font-display); color: var(--bg); background: var(--cyan); box-shadow: 0 0 18px rgba(34,242,255,.5); }
  .btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .small { font-size: 14px; color: var(--muted); }
  .small a { color: var(--cyan); }
</style>
</head>
<body>
<main class="card" id="card">
  <img src="../images/icon.png" alt="Time Duel app icon">
  <h1 id="title">Time Duel <span>challenge</span></h1>
  <div id="details"></div>
  <a class="btn" id="open" href="#">Open in Time Duel</a>
  <p class="small" id="get">Don't have the game yet? Time Duel is coming soon to the App Store. <a href="../">Read more</a></p>
  <template id="get-sv">Har du inte spelet än? Time Duel kommer snart till App Store. <a href="../">Läs mer</a></template>
</main>

<script>
(function () {
  // Swedish for Swedish phones, English for everyone else (like the game).
  var sv = /^sv/i.test(navigator.language || "");
  if (sv) document.documentElement.lang = "sv";
  function T(en, swe) { return sv ? swe : en; }
  var params = new URLSearchParams(location.search);
  var d = params.get("d"), r = params.get("r");
  var raw = d || r;
  var title = document.getElementById("title"), details = document.getElementById("details"), open = document.getElementById("open");
  if (sv) document.getElementById("get").innerHTML = document.getElementById("get-sv").innerHTML;
  function decode(s) {
    try {
      var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  }
  // Points are shown within what a real game can give, whatever the link says.
  function num(n) { n = Math.max(0, Math.min(2000, Math.round(Number(n) || 0))); return n.toLocaleString(sv ? "sv-SE" : "en-GB"); }
  function name(t) { t = String(t || "").replace(/\s+/g, " ").trim().slice(0, 20); return t || T("A friend", "En vän"); }
  var cats = sv
    ? { inventions: "Uppfinningar", movies: "Filmer", books: "Böcker", people: "Kända födslar",
        achievements: "Mänskliga bedrifter", brands: "Varumärken", mix: "Blanda" }
    : { inventions: "Inventions", movies: "Movies", books: "Books", people: "Famous births",
        achievements: "Human achievements", brands: "Brands", mix: "Shuffle" };
  var data = raw ? decode(raw) : null;
  if (!data) {
    title.textContent = T("This link doesn't work", "Länken fungerar inte");
    details.innerHTML = '<p class="muted">' + T("It may have been cut off when it was copied. Ask your friend to send it again.",
                                                 "Den kan ha klippts av när den kopierades. Be din vän skicka den igen.") + '</p>';
    open.hidden = true;
    return;
  }
  open.href = "timeduel://c?" + (d ? "d=" : "r=") + encodeURIComponent(raw);
  function esc(t) { var el = document.createElement("span"); el.textContent = t || ""; return el.innerHTML; }
  var from = esc(name(data.from));
  if (d) {
    title.innerHTML = T(from + " challenges <span>you!</span>", from + " utmanar <span>dig!</span>");
    details.innerHTML =
      '<div class="label">' + T("Points to beat", "Poäng att slå") + '</div><div class="points">' + num(data.points) + '</div>' +
      '<p class="muted">' + esc(cats[data.cat] || "") + T(" · the same 10 questions · 15 seconds each", " · samma 10 frågor · 15 sekunder per fråga") + '</p>';
    open.textContent = T("Accept in Time Duel", "Anta i Time Duel");
  } else {
    var mine = Number(data.toPoints) || 0, theirs = Number(data.points) || 0;
    var verdict = mine > theirs ? T("You won!", "Du vann!") : (mine < theirs ? from + T(" won", " vann") : T("It's a tie!", "Oavgjort!"));
    title.innerHTML = T(from + " played <span>your challenge</span>", from + " spelade <span>din utmaning</span>");
    details.innerHTML =
      '<div class="points" style="font-size:clamp(30px,9vw,40px)">' + verdict + '</div>' +
      '<p class="muted">' + T("You ", "Du ") + num(mine) + T(" points · ", " poäng · ") + from + ' ' + num(theirs) + T(" points", " poäng") + '</p>';
    open.textContent = T("Count it in Time Duel", "Räkna in det i Time Duel");
  }
})();
</script>
</body>
</html>
